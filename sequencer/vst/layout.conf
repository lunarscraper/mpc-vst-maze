# Maze Sequencer MPC skin layout: the Force Shadow page (force-maze: maze-sequencer/addon/shadow_page.conf)
# rebuilt as a native MPC plugin skin by shadow_skin.py, in the same brushed-metal / walnut look as Maze Voice.
# Step bits are 8 toggles per line (the shadow page's tap-to-flip bit strip). qlinks lines: nested MPC pages.

knob_strip=images/moog_knob_voice.png
theme_accent=f85d5d
theme_accent_hi=ffffff
art_css=skin.css
theme_panel=dfd1c3
theme_bg=121212
theme_line=5f5d59

[tab SEQUENCERS]
art file="images/panel_bg.png" fit=stretch
frame x=34 y=103 w=860 h=265 title="SEQUENCER A"
picture x=60 y=141 w=760 h=60 key=s1_run files="images/run_0.png,images/run_1.png,images/run_2.png,images/run_3.png,images/run_4.png,images/run_5.png,images/run_6.png,images/run_7.png,images/run_8.png"
toggle cx=100 cy=171 label="1" key=s1_step0 img=images/led_off.png img_on=images/led_on.png
toggle cx=195 cy=171 label="2" key=s1_step1 img=images/led_off.png img_on=images/led_on.png
toggle cx=290 cy=171 label="3" key=s1_step2 img=images/led_off.png img_on=images/led_on.png
toggle cx=385 cy=171 label="4" key=s1_step3 img=images/led_off.png img_on=images/led_on.png
toggle cx=480 cy=171 label="5" key=s1_step4 img=images/led_off.png img_on=images/led_on.png
toggle cx=575 cy=171 label="6" key=s1_step5 img=images/led_off.png img_on=images/led_on.png
toggle cx=670 cy=171 label="7" key=s1_step6 img=images/led_off.png img_on=images/led_on.png
toggle cx=765 cy=171 label="8" key=s1_step7 img=images/led_off.png img_on=images/led_on.png
knob cx=110 cy=263 r=34 label="CORRUPT" key=s1_corrupt
knob cx=260 cy=263 r=34 label="CV RANGE" key=s1_cv_range
knob cx=410 cy=263 r=34 label="LENGTH" key=s1_length
knob cx=560 cy=263 r=34 label="MIDI CH" key=s1_channel
button cx=700 cy=263 label="ADVANCE" key=s1_adv
button cx=810 cy=263 label="REGEN" key=s1_regen
frame x=34 y=380 w=860 h=265 title="SEQUENCER B"
picture x=60 y=418 w=760 h=60 key=s2_run files="images/run_0.png,images/run_1.png,images/run_2.png,images/run_3.png,images/run_4.png,images/run_5.png,images/run_6.png,images/run_7.png,images/run_8.png"
toggle cx=100 cy=448 label="1" key=s2_step0 img=images/led_off.png img_on=images/led_on.png
toggle cx=195 cy=448 label="2" key=s2_step1 img=images/led_off.png img_on=images/led_on.png
toggle cx=290 cy=448 label="3" key=s2_step2 img=images/led_off.png img_on=images/led_on.png
toggle cx=385 cy=448 label="4" key=s2_step3 img=images/led_off.png img_on=images/led_on.png
toggle cx=480 cy=448 label="5" key=s2_step4 img=images/led_off.png img_on=images/led_on.png
toggle cx=575 cy=448 label="6" key=s2_step5 img=images/led_off.png img_on=images/led_on.png
toggle cx=670 cy=448 label="7" key=s2_step6 img=images/led_off.png img_on=images/led_on.png
toggle cx=765 cy=448 label="8" key=s2_step7 img=images/led_off.png img_on=images/led_on.png
knob cx=110 cy=540 r=34 label="CORRUPT" key=s2_corrupt
knob cx=260 cy=540 r=34 label="CV RANGE" key=s2_cv_range
knob cx=410 cy=540 r=34 label="LENGTH" key=s2_length
knob cx=560 cy=540 r=34 label="MIDI CH" key=s2_channel
button cx=700 cy=540 label="ADVANCE" key=s2_adv
button cx=810 cy=540 label="REGEN" key=s2_regen
frame x=914 y=103 w=332 h=542 title="TIMING / SCALE"
enum_h cx=1084 cy=192 sw=50 label="NOTE RATE" key=note_rate
knob cx=990 cy=292 r=30 label="NOTE LEN" key=note_length
knob cx=1084 cy=292 r=30 label="TRANSPOSE" key=transpose
knob cx=1178 cy=292 r=30 label="TRIG MIX" key=trig_mix
enum_h cx=1084 cy=420 sw=56 label="RESET BOTH - BARS" key=g_reset
popup cx=1084 cy=516 w=300 h=44 label="SCALE" key=scale cols=3
popup cx=1084 cy=602 w=300 h=44 label="KEY" key=key cols=4
text cx=44 cy=674 label="MAZE SEQUENCER" weight=700 size=3 spacing=-1 align=left
qlinks "SEQ A" = s1_corrupt,s1_cv_range,s1_length,s1_channel,s1_adv,s1_regen,trig_mix,g_reset
qlinks "SEQ B" = s2_corrupt,s2_cv_range,s2_length,s2_channel,s2_adv,s2_regen,trig_mix,g_reset
qlinks "TIMING / SCALE" = note_rate,note_length,transpose,scale,key,trig_mix,g_reset

