# Maze Voice MPC skin layout: the Force Shadow page (force-maze: maze-voice/addon/shadow_page.conf)
# rebuilt as a native MPC plugin skin by shadow_skin.py. Same coordinates and
# widget syntax. Differences from the shadow page:
#   - no DEST / GAIN (host-level mixer controls, not plugin parameters)
#   - LFO SYNC DIV shows all 8 divisions (two rows)
#   - qlinks lines: nested MPC pages sharing one design, each with its own Q-Links
#     (1-8 = knob bank 1, 9-16 = bank 2)

knob_strip=images/moog_knob_voice.png
theme_accent=f85d5d
theme_accent_hi=ffffff
art_css=skin.css
theme_panel=dfd1c3
theme_bg=121212
theme_line=5f5d59
[tab VOICE]
art file="images/panel_bg.png" fit=stretch
frame x=34 y=103 w=430 h=543 title="OSCILLATOR"
frame x=790 y=105 w=180 h=543 title="ENVELOPES"
frame x=480 y=105 w=288 h=543 title="MIXER"
frame x=1007 y=105 w=221 h=543 title="TONE/OUT"
knob cx=116 cy=208 r=39 label="VCO TUNE" key=vco_tune
knob cx=251 cy=208 r=25 label="VCO EG1" key=vco_eg1
knob cx=398 cy=208 r=25 label="VCO KEY" key=vco_key
knob cx=116 cy=529 r=39 label="MOD FREQ" key=mod_freq
knob cx=251 cy=529 r=25 label="MOD EG1" key=mod_eg1
knob cx=398 cy=529 r=25 label="MOD KEY" key=mod_key
knob cx=163 cy=374 r=25 label="FM DEPTH" key=fm_depth
knob cx=318 cy=374 r=25 label="FM EG1" key=fm_eg1
knob cx=882 cy=208 r=45 label="ENV1 DEC" key=env1_decay
knob cx=882 cy=378 r=45 label="VCA DECAY" key=env2_decay
knob cx=546 cy=208 r=30 label="VCO LVL" key=vco_lvl
knob cx=544 cy=369 r=30 label="MOD LVL" key=mod_lvl
knob cx=538 cy=529 r=30 label="RING LVL" key=ring_lvl
knob cx=676 cy=369 r=30 label="NOISE TONE" key=noise_tone
knob cx=674 cy=208 r=30 label="NOISE LVL" key=noise_lvl
knob cx=1118 cy=210 r=36 label="TONE/SAT" key=sat
knob cx=1118 cy=376 r=36 label="OUT LEVEL" key=level
enum_h cx=1118 cy=570 sw=90 label="VOICE MODE" key=out_mode options="INTERNAL,EXTERNAL"
text cx=122 cy=674 label="MAZE VOICE" weight=700 size=3 spacing=-1
qlinks "VOICE" = vco_tune,vco_eg1,vco_key,mod_freq,mod_eg1,mod_key,fm_depth,fm_eg1,env1_decay,env2_decay,vco_lvl,mod_lvl,ring_lvl,noise_lvl,sat,level

[tab WAVEFOLDER / FILTER]
art file="images/panel_bg.png" fit=stretch
frame x=34 y=103 w=720 h=236 title="WAVEFOLDER"
frame x=34 y=378 w=867 h=250 title="FILTER"
knob cx=122 cy=220 r=45 label="FOLD DRIVE" key=fold_drive
knob cx=540 cy=220 r=39 label="FOLD BIAS" key=fold_bias
knob cx=261 cy=220 r=25 label="FOLD EG1" key=fold_eg1
knob cx=401 cy=220 r=25 label="FOLD KEY" key=fold_key
enum_v cx=850 cy=174 label="ROUTE" key=route options="VCW>VCF,PARALLEL,VCF>VCW"
knob cx=852 cy=288 r=39 label="BLEND" key=blend
knob cx=122 cy=509 r=45 label="CUTOFF" key=cutoff
knob cx=540 cy=509 r=39 label="RESONANCE" key=reso
knob cx=675 cy=507 r=39 label="LP-BP" key=filter_mode
knob cx=261 cy=509 r=25 label="CUT EG1" key=cutoff_eg1
knob cx=401 cy=509 r=25 label="CUT KEY" key=cutoff_key
knob cx=809 cy=509 r=39 label="FILT DRIVE" key=filt_drive
qlinks "FOLD / FILTER" = fold_drive,fold_bias,fold_eg1,fold_key,route,blend,filt_drive,filter_mode,cutoff,reso,cutoff_eg1,cutoff_key

[tab MOD / RANDOM]
art file="images/panel_bg.png" fit=stretch
frame x=36 y=100 w=1207 h=111 title="RANDOMISE"
toggle cx=155 cy=164 label="RND VOICE" key=rnd_voice
toggle cx=385 cy=164 label="RND FOLD" key=rnd_wavefolder
toggle cx=615 cy=164 label="RND FILT" key=rnd_filter
toggle cx=845 cy=164 label="RND TONE" key=rnd_tone
button cx=1085 cy=169 label="GENERATE" key=rnd_go
frame x=36 y=232 w=595 h=470 title="LFO 1"
enum_h cx=221 cy=324 label="SHAPE" key=lfo1_shape options="SAW,TRI,SIN,SQR,S/H" sw=52
popup cx=221 cy=404 w=200 h=44 label="SYNC DIV" key=lfo1_div options="16TH,8TH,4TH,HALF,1BAR,2BAR,4BAR,8BAR"
knob cx=464 cy=367 r=30 label="RATE" key=lfo1_rate
toggle cx=576 cy=340 label="SYNC" key=lfo1_sync
toggle cx=576 cy=410 label="RETRIG" key=lfo1_retrig
knob cx=126 cy=512 r=23 label="VCO PITCH" key=lfo1_vco_pitch
knob cx=264 cy=512 r=23 label="MOD PITCH" key=lfo1_mod_pitch
knob cx=402 cy=512 r=23 label="FM DEPTH" key=lfo1_fm_depth
knob cx=540 cy=512 r=23 label="CUTOFF" key=lfo1_cutoff
knob cx=126 cy=620 r=23 label="ENV1 DEC" key=lfo1_env1_decay
knob cx=264 cy=620 r=23 label="ENV2 DEC" key=lfo1_env2_decay
knob cx=402 cy=620 r=23 label="FOLD AMT" key=lfo1_fold_amt
knob cx=540 cy=620 r=23 label="FOLD BIAS" key=lfo1_fold_bias
frame x=648 y=232 w=595 h=470 title="LFO 2"
enum_h cx=833 cy=324 label="SHAPE" key=lfo2_shape options="SAW,TRI,SIN,SQR,S/H" sw=52
popup cx=833 cy=404 w=200 h=44 label="SYNC DIV" key=lfo2_div options="16TH,8TH,4TH,HALF,1BAR,2BAR,4BAR,8BAR"
knob cx=1076 cy=367 r=30 label="RATE" key=lfo2_rate
toggle cx=1188 cy=340 label="SYNC" key=lfo2_sync
toggle cx=1188 cy=410 label="RETRIG" key=lfo2_retrig
knob cx=738 cy=512 r=23 label="VCO PITCH" key=lfo2_vco_pitch
knob cx=876 cy=512 r=23 label="MOD PITCH" key=lfo2_mod_pitch
knob cx=1014 cy=512 r=23 label="FM DEPTH" key=lfo2_fm_depth
knob cx=1152 cy=512 r=23 label="CUTOFF" key=lfo2_cutoff
knob cx=738 cy=620 r=23 label="ENV1 DEC" key=lfo2_env1_decay
knob cx=876 cy=620 r=23 label="ENV2 DEC" key=lfo2_env2_decay
knob cx=1014 cy=620 r=23 label="FOLD AMT" key=lfo2_fold_amt
knob cx=1152 cy=620 r=23 label="FOLD BIAS" key=lfo2_fold_bias
qlinks "LFO 1" = lfo1_shape,lfo1_rate,lfo1_sync,lfo1_div,lfo1_retrig,lfo1_vco_pitch,lfo1_mod_pitch,lfo1_fm_depth,lfo1_cutoff,lfo1_env1_decay,lfo1_env2_decay,lfo1_filt_drive,lfo1_fold_amt,lfo1_fold_bias,rnd_go
qlinks "LFO 2" = lfo2_shape,lfo2_rate,lfo2_sync,lfo2_div,lfo2_retrig,lfo2_vco_pitch,lfo2_mod_pitch,lfo2_fm_depth,lfo2_cutoff,lfo2_env1_decay,lfo2_env2_decay,lfo2_filt_drive,lfo2_fold_amt,lfo2_fold_bias,rnd_go
